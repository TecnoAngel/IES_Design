# Tema claro fijo con los colores del logo de la Junta de Castilla y León
# (rojo carmín + oro), para que la interfaz se vea igual para todo el profesorado
# y los desplegables de las tablas tengan contraste.
[theme]
base = "light"
primaryColor = "#A6182E"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#FAF4EC"
textColor = "#221C18"
